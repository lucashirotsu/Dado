<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#16202a">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <title>Dado Virtual</title>
    <style>
        @font-face {
            font-family: 'fonte';
            src: url('./fonte.ttf');
        }

        :root {
            --box-size: 140px;
            --inner-size: 132px;
            --border-radius: 10px;
            --content-color: rgba(135, 206, 250, 0.95);
            --content-shadow: 0 0 12px rgba(135, 206, 250, 0.8);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #243342 0%, #16202a 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100dvh;
            margin: 0;
            padding: 35px 16px 22px;
            font-family: 'fonte', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 300;
            color: white;
            overflow-x: hidden;
        }

        /* Arena Principal dos Dados */
        #dice-arena {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 75px 70px;
            max-width: 1100px;
            width: 100%;
            flex: 1;
            align-content: center;
            padding: 20px 0;
        }

        .dice-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop-in {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Botão discreto para remover dado */
        .remove-die-btn {
            position: absolute;
            top: -14px;
            right: -14px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: rgba(231, 76, 60, 0.85);
            color: white;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            font-size: 13px;
            line-height: 1;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .dice-wrapper:hover .remove-die-btn {
            opacity: 1;
        }

        .remove-die-btn:hover {
            background-color: #e74c3c;
            transform: scale(1.15);
        }

        /* Etiqueta minimalista de lados */
        .die-badge {
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 3px;
            background: rgba(0, 0, 0, 0.25);
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .die-badge input {
            width: 44px;
            padding: 1px 2px;
            font-size: 0.9rem;
            border: none;
            background: transparent;
            color: white;
            text-align: center;
            outline: none;
        }

        .die-badge input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* Cena 3D acelerada por GPU */
        .scene {
            width: var(--box-size);
            height: var(--box-size);
            perspective: 750px;
            position: relative;
            transform-style: preserve-3d;
            will-change: transform;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .scene.shrunk {
            transform: scale(0.8);
            transition: transform 0.25s ease-out;
        }

        .scene.boom {
            animation: boom-effect 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes boom-effect {
            0%   { transform: scale(0.8); }
            40%  { transform: scale(1.22); filter: brightness(1.35); }
            75%  { transform: scale(0.96); filter: brightness(1.1); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        .item-box {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            cursor: pointer;
            will-change: transform;
            transform: translateY(0px) rotateY(0deg) rotateX(8deg) rotateZ(0deg);
        }

        .item-box.idle {
            animation: spin 9s linear infinite;
        }

        .item-box.rolling {
            pointer-events: none;
            animation: spin-fast 0.45s linear infinite;
        }

        .item-box.settling {
            pointer-events: none;
            transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(0px) rotateY(0deg) rotateX(8deg) rotateZ(0deg);
        }

        .item-box.floating {
            animation: gentle-float 5.2s ease-in-out infinite;
        }

        @keyframes spin {
            from { transform: rotateY(0deg) rotateX(10deg); }
            to   { transform: rotateY(360deg) rotateX(10deg); }
        }

        @keyframes spin-fast {
            from { transform: rotateY(0deg) rotateX(10deg); }
            to   { transform: rotateY(360deg) rotateX(0deg); }
        }

        @keyframes gentle-float {
            0%   { transform: translateY(0px) rotateY(0deg) rotateX(8deg) rotateZ(0deg); }
            25%  { transform: translateY(-6px) rotateY(12deg) rotateX(11deg) rotateZ(1.5deg); }
            50%  { transform: translateY(-2px) rotateY(0deg) rotateX(5deg) rotateZ(0deg); }
            75%  { transform: translateY(-6px) rotateY(-12deg) rotateX(11deg) rotateZ(-1.5deg); }
            100% { transform: translateY(0px) rotateY(0deg) rotateX(8deg) rotateZ(0deg); }
        }

        /* Rotação contínua do espectro arco-íris acelerada por GPU */
        @keyframes rainbow-cycle {
            from { filter: hue-rotate(0deg) brightness(1.2); }
            to   { filter: hue-rotate(360deg) brightness(1.2); }
        }

        /* Faces externas com o brilho original restaurado (sem backdrop-filter) */
        .face {
            position: absolute;
            width: var(--box-size);
            height: var(--box-size);
            background: linear-gradient(135deg,
                    rgba(255, 0, 255, 0.24),
                    rgba(0, 255, 255, 0.24),
                    rgba(255, 255, 0, 0.22),
                    rgba(255, 40, 90, 0.24));
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: var(--border-radius);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.45), inset 0 0 12px rgba(255, 255, 255, 0.25);
            animation: rainbow-cycle 7s linear infinite;
            overflow: hidden;
        }

        .face::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle, rgba(255, 255, 255, 0.14) 7px, transparent 8px);
            background-size: 38px 38px;
            pointer-events: none;
        }

        /* Núcleo interno que veda os buracos nos 8 vértices */
        .inner-face {
            position: absolute;
            top: calc((var(--box-size) - var(--inner-size)) / 2);
            left: calc((var(--box-size) - var(--inner-size)) / 2);
            width: var(--inner-size);
            height: var(--inner-size);
            background: linear-gradient(135deg,
                    rgba(255, 0, 255, 0.18),
                    rgba(0, 255, 255, 0.18),
                    rgba(255, 255, 0, 0.18));
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 3px;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.2);
            animation: rainbow-cycle 7s linear infinite;
            pointer-events: none;
        }

        .front  { transform: rotateY(0deg) translateZ(calc(var(--box-size) / 2)); }
        .back   { transform: rotateY(180deg) translateZ(calc(var(--box-size) / 2)); }
        .right  { transform: rotateY(90deg) translateZ(calc(var(--box-size) / 2)); }
        .left   { transform: rotateY(-90deg) translateZ(calc(var(--box-size) / 2)); }
        .top    { transform: rotateX(90deg) translateZ(calc(var(--box-size) / 2)); }
        .bottom { transform: rotateX(-90deg) translateZ(calc(var(--box-size) / 2)); }

        .inner-front  { transform: rotateY(0deg) translateZ(calc(var(--inner-size) / 2)); }
        .inner-back   { transform: rotateY(180deg) translateZ(calc(var(--inner-size) / 2)); }
        .inner-right  { transform: rotateY(90deg) translateZ(calc(var(--inner-size) / 2)); }
        .inner-left   { transform: rotateY(-90deg) translateZ(calc(var(--inner-size) / 2)); }
        .inner-top    { transform: rotateX(90deg) translateZ(calc(var(--inner-size) / 2)); }
        .inner-bottom { transform: rotateX(-90deg) translateZ(calc(var(--inner-size) / 2)); }

        /* Número central */
        .stationary-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate3d(-50%, -50%, 1px) scaleX(0.92);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: calc(var(--box-size) * 0.68);
            font-weight: 100;
            font-synthesis: none;
            color: #FFF;
            paint-order: stroke fill;
            -webkit-text-stroke: 1px var(--content-color);
            text-shadow: var(--content-shadow);
            pointer-events: none;
            will-change: transform;
            animation: pulse-slow 2.2s infinite alternate ease-in-out;
        }

        @keyframes pulse-slow {
            0%   { transform: translate3d(-50%, -50%, 1px) scaleX(0.92) scale(1); }
            100% { transform: translate3d(-50%, -50%, 1px) scaleX(0.92) scale(1.16); }
        }

        @keyframes pulse-fast {
            0%   { transform: translate3d(-50%, -50%, 1px) scaleX(0.92) scale(0.95); }
            100% { transform: translate3d(-50%, -50%, 1px) scaleX(0.92) scale(1.18); }
        }

        .stationary-content.rolling-animation {
            animation: pulse-fast 0.25s infinite alternate ease-in-out;
        }

        /* Área Inferior: Resultado + Controles Minimalistas */
        .bottom-dock {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 560px;
            margin-top: 16px;
        }

        #result-display {
            margin: 0;
            font-size: 1.55rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            min-height: 32px;
            color: #87cefa;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.35);
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        select, input[type="number"] {
            padding: 8px 10px;
            border-radius: 8px;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            background-color: #34495e;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
        }

        input[type="number"] {
            width: 64px;
            text-align: center;
        }

        select:focus, input[type="number"]:focus {
            border-color: #87cefa;
        }

        button {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-add {
            background-color: #27ae60;
            color: white;
        }

        .btn-roll-all {
            background: linear-gradient(135deg, #3498db, #8e44ad);
            color: white;
            padding: 8px 18px;
        }

        .btn-clear {
            background-color: rgba(255, 255, 255, 0.12);
            color: #ecf0f1;
        }

        /* =========================================================
           OTIMIZAÇÕES E LAYOUT RESPONSIVO PARA CELULAR
           ========================================================= */
        @media (max-width: 600px) {
            :root {
                --box-size: 86px;
                --inner-size: 80px;
                --border-radius: 8px;
            }

            /* 1, 2 ou 3 dados permanecem todos lado a lado na mesma linha */
            #dice-arena {
                flex-wrap: nowrap;
                gap: 24px 16px;
                padding: 10px 0;
            }

            /* A partir do 4º dado adicionado, quebra linha e vira grid de 2 colunas */
            #dice-arena:has(.dice-wrapper:nth-child(4)) {
                --box-size: 108px;
                --inner-size: 102px;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                justify-items: center;
                gap: 38px 16px;
            }

            .remove-die-btn {
                opacity: 0.85;
                top: -12px;
                right: -12px;
                width: 22px;
                height: 22px;
            }

            .die-badge {
                margin-top: 18px;
                padding: 2px 6px;
                font-size: 0.8rem;
            }

            .die-badge input {
                width: 36px;
                font-size: 0.8rem;
            }

            .inner-face {
                display: none;
            }

            .face {
                border-radius: 5px;
            }

            #result-display {
                font-size: 1.35rem;
            }

            .controls-bar {
                width: 100%;
                gap: 6px;
                padding: 8px;
            }

            .controls-bar select,
            .controls-bar input[type="number"],
            .controls-bar button {
                padding: 8px 10px;
                font-size: 0.92rem;
            }
        }
    </style>
</head>

<body>

    <div id="dice-arena"></div>

    <div class="bottom-dock">
        <h2 id="result-display"></h2>

        <div class="controls-bar">
            <select id="preset-selector" title="Modelos rápidos">
                <option value="6" selected>D6</option>
                <option value="10">D10</option>
                <option value="12">D12</option>
                <option value="20">D20</option>
                <option value="100">D100</option>
            </select>

            <input type="number" id="custom-sides" value="6" min="2" max="10000" title="Quantidade de lados">

            <button class="btn-add" id="add-die-btn" title="Adicionar dado">+ Dado</button>
            <button class="btn-roll-all" id="roll-all-btn">Rolar</button>
            <button class="btn-clear" id="reset-btn" title="Resetar mesa">Limpar</button>
        </div>
    </div>

    <script>
        const diceArena = document.getElementById('dice-arena');
        const presetSelector = document.getElementById('preset-selector');
        const customSidesInput = document.getElementById('custom-sides');
        const addDieBtn = document.getElementById('add-die-btn');
        const rollAllBtn = document.getElementById('roll-all-btn');
        const resetBtn = document.getElementById('reset-btn');
        const resultDisplay = document.getElementById('result-display');

        const rollSound = new Audio('https://github.com/lucashirotsu/Dado/blob/main/Som.m4a?raw=true');

        let diceList = [];
        let dieIdCounter = 0;

        presetSelector.addEventListener('change', () => {
            customSidesInput.value = presetSelector.value;
        });

        customSidesInput.addEventListener('input', () => {
            const val = customSidesInput.value;
            const match = Array.from(presetSelector.options).find(opt => opt.value === val);
            if (match) presetSelector.value = val;
        });

        function getRandomNumber(max) {
            return Math.floor(Math.random() * max) + 1;
        }

        function adjustFontSize(element, text) {
            const length = String(text).length;
            if (length >= 4) {
                element.style.fontSize = 'calc(var(--box-size) * 0.34)';
                element.style.webkitTextStroke = '0.6px var(--content-color)';
            } else if (length === 3) {
                element.style.fontSize = 'calc(var(--box-size) * 0.45)';
                element.style.webkitTextStroke = '0.8px var(--content-color)';
            } else {
                element.style.fontSize = 'calc(var(--box-size) * 0.68)';
                element.style.webkitTextStroke = '1px var(--content-color)';
            }
        }

        function createDie(sides = 6) {
            const id = ++dieIdCounter;
            const validSides = Math.max(2, parseInt(sides) || 6);

            const wrapper = document.createElement('div');
            wrapper.className = 'dice-wrapper';

            wrapper.innerHTML = `
                <button class="remove-die-btn" title="Remover">×</button>
                <div class="scene">
                    <div class="item-box idle">
                        <div class="inner-face inner-front"></div>
                        <div class="inner-face inner-back"></div>
                        <div class="inner-face inner-right"></div>
                        <div class="inner-face inner-left"></div>
                        <div class="inner-face inner-top"></div>
                        <div class="inner-face inner-bottom"></div>

                        <div class="face front"></div>
                        <div class="face back"></div>
                        <div class="face right"></div>
                        <div class="face left"></div>
                        <div class="face top"></div>
                        <div class="face bottom"></div>
                    </div>
                    <div class="stationary-content">?</div>
                </div>
                <div class="die-badge">
                    <span>D</span>
                    <input type="number" class="individual-sides" value="${validSides}" min="2" max="10000">
                </div>
            `;

            const scene = wrapper.querySelector('.scene');
            const itemBox = wrapper.querySelector('.item-box');
            const contentEl = wrapper.querySelector('.stationary-content');
            const removeBtn = wrapper.querySelector('.remove-die-btn');
            const sidesInput = wrapper.querySelector('.individual-sides');

            const dieObj = {
                id,
                wrapper,
                scene,
                itemBox,
                contentEl,
                sidesInput,
                isRolling: false,
                lastResult: null
            };

            itemBox.addEventListener('click', () => {
                rollSingleDie(dieObj, true);
            });

            removeBtn.addEventListener('click', () => {
                if (diceList.length <= 1) return;
                wrapper.remove();
                diceList = diceList.filter(d => d.id !== id);
                updateTotalDisplay();
            });

            diceArena.appendChild(wrapper);
            diceList.push(dieObj);
        }

        function playRollSound() {
            rollSound.currentTime = 0;
            rollSound.play().catch(() => {});
        }

        function rollSingleDie(dieObj, isSingleClick = false) {
            if (dieObj.isRolling) return Promise.resolve({ value: dieObj.lastResult });

            if (isSingleClick) {
                playRollSound();
                resultDisplay.textContent = 'Sorteando...';
            }

            dieObj.isRolling = true;

            dieObj.scene.classList.remove('boom');
            dieObj.scene.classList.add('shrunk');

            dieObj.itemBox.classList.remove('idle', 'settling', 'floating');
            dieObj.itemBox.classList.add('rolling');
            dieObj.contentEl.classList.add('rolling-animation');

            const maxSides = Math.max(2, parseInt(dieObj.sidesInput.value) || 6);
            dieObj.sidesInput.value = maxSides;

            const interval = setInterval(() => {
                const tempVal = getRandomNumber(maxSides);
                dieObj.contentEl.textContent = tempVal;
                adjustFontSize(dieObj.contentEl, tempVal);
            }, 85);

            return new Promise((resolve) => {
                setTimeout(() => {
                    clearInterval(interval);

                    const finalResult = getRandomNumber(maxSides);
                    dieObj.lastResult = finalResult;
                    dieObj.contentEl.textContent = finalResult;
                    adjustFontSize(dieObj.contentEl, finalResult);

                    dieObj.scene.classList.remove('shrunk');
                    void dieObj.scene.offsetWidth;
                    dieObj.scene.classList.add('boom');

                    dieObj.itemBox.classList.remove('rolling');
                    dieObj.itemBox.classList.add('settling');
                    dieObj.contentEl.classList.remove('rolling-animation');

                    setTimeout(() => {
                        dieObj.itemBox.classList.remove('settling');
                        dieObj.itemBox.classList.add('floating');
                        dieObj.isRolling = false;
                    }, 550);

                    if (isSingleClick) {
                        updateTotalDisplay();
                    }

                    resolve({ value: finalResult });
                }, 2200);
            });
        }

        async function rollAllDice() {
            if (diceList.some(d => d.isRolling)) return;

            playRollSound();
            resultDisplay.textContent = 'Sorteando...';

            await Promise.all(diceList.map(die => rollSingleDie(die, false)));
            updateTotalDisplay();
        }

        function updateTotalDisplay() {
            const rolledDice = diceList.filter(d => d.lastResult !== null);
            if (rolledDice.length === 0) {
                resultDisplay.textContent = '';
                return;
            }

            if (rolledDice.length === 1) {
                resultDisplay.textContent = `Resultado: ${rolledDice[0].lastResult}`;
            } else {
                const sum = rolledDice.reduce((acc, d) => acc + d.lastResult, 0);
                const details = rolledDice.map(d => d.lastResult).join(' + ');
                resultDisplay.textContent = `Total: ${sum} (${details})`;
            }
        }

        addDieBtn.addEventListener('click', () => {
            createDie(parseInt(customSidesInput.value) || 6);
        });

        rollAllBtn.addEventListener('click', rollAllDice);

        resetBtn.addEventListener('click', () => {
            diceArena.innerHTML = '';
            diceList = [];
            resultDisplay.textContent = '';
            createDie(parseInt(customSidesInput.value) || 6);
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                rollAllDice();
            }
        });

        createDie(6);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>

</html>
