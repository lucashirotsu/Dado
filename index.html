<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dado Virtual</title>
    <style>
        @font-face {
            font-family: 'fonte';
            src: url('./fonte.ttf');
        }

        :root {
            --box-size: 150px;
            --border-radius: 5px;
            --content-color: rgba(135, 206, 250, 0.9);
            --content-shadow: 0 0 15px rgba(135, 206, 250, 0.7);
        }

        body {
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'fonte', sans-serif;
            color: white;
            overflow: hidden;
        }

        .scene {
            width: var(--box-size);
            height: var(--box-size);
            perspective: 800px;
            margin-bottom: 40px;
            position: relative;
            transform-style: preserve-3d;
        }

        .item-box {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: spin 8s linear infinite;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .item-box.rolling {
            pointer-events: none;
            animation: spin-fast 0.5s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotateY(0deg) rotateX(10deg);
            }

            to {
                transform: rotateY(360deg) rotateX(10deg);
            }
        }

        @keyframes spin-fast {
            from {
                transform: rotateY(0deg) rotateX(10deg);
            }

            to {
                transform: rotateY(360deg) rotateX(0deg);
            }
        }

        .face {
            position: absolute;
            width: var(--box-size);
            height: var(--box-size);
            background: linear-gradient(135deg,
                    rgba(255, 0, 255, 0.2), rgba(0, 255, 255, 0.2),
                    rgba(255, 255, 0, 0.2), rgba(255, 0, 0, 0.2));
            background-size: 400% 400%;
            animation: gradient-flow 10s ease infinite;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: var(--border-radius);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.2);
            backdrop-filter: brightness(1.2);
            -webkit-backdrop-filter: brightness(1.2);
            overflow: hidden;
        }

        .face::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 10% 10%, rgba(255, 255, 255, 0.1) 7px, transparent 0),
                radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.1) 7px, transparent 0),
                radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.1) 7px, transparent 0),
                radial-gradient(circle at 70% 40%, rgba(255, 255, 255, 0.1) 7px, transparent 0),
                radial-gradient(circle at 90% 50%, rgba(255, 255, 255, 0.1) 7px, transparent 0),
                radial-gradient(circle at 20% 60%, rgba(255, 255, 255, 0.1) 7px, transparent 0),
                radial-gradient(circle at 40% 70%, rgba(255, 255, 255, 0.1) 7px, transparent 0),
                radial-gradient(circle at 60% 80%, rgba(255, 255, 255, 0.1) 7px, transparent 0),
                radial-gradient(circle at 80% 90%, rgba(255, 255, 255, 0.1) 7px, transparent 0);
            background-size: 80px 80px;
            pointer-events: none;
            opacity: 0.8;
        }

        @keyframes gradient-flow {
            0% {
                background-position: 0% 0%;
            }

            25% {
                background-position: 100% 0%;
            }

            50% {
                background-position: 100% 100%;
            }

            75% {
                background-position: 0% 100%;
            }

            100% {
                background-position: 0% 0%;
            }
        }

        .front {
            transform: rotateY(0deg) translateZ(calc(var(--box-size) / 2));
        }

        .back {
            transform: rotateY(180deg) translateZ(calc(var(--box-size) / 2));
        }

        .right {
            transform: rotateY(90deg) translateZ(calc(var(--box-size) / 2));
        }

        .left {
            transform: rotateY(-90deg) translateZ(calc(var(--box-size) / 2));
        }

        .top {
            transform: rotateX(90deg) translateZ(calc(var(--box-size) / 2));
        }

        .bottom {
            transform: rotateX(-90deg) translateZ(calc(var(--box-size) / 2));
        }

        #stationary-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate3d(-50%, -50%, 1px);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;

            font-size: calc(var(--box-size) * 0.6);
            font-weight: bold;
            color: #FFF;
            -webkit-text-stroke: 4px var(--content-color);
            text-shadow: var(--content-shadow);


            pointer-events: none;
            animation: pulse-slow 2s infinite alternate ease-in-out;
        }

        @keyframes pulse-slow {
            0% {
                transform: translate3d(-50%, -50%, 1px) scale(1);
                opacity: 1;
            }

            100% {
                transform: translate3d(-50%, -50%, 1px) scale(1.5);
                opacity: 0.9;
            }
        }

        @keyframes pulse-fast {
            0% {
                transform: translate3d(-50%, -50%, 1px) scale(1);
                opacity: 1;
            }

            50% {
                transform: translate3d(-50%, -50%, 1px) scale(1.5);
                opacity: 0.8;
            }

            100% {
                transform: translate3d(-50%, -50%, 1px) scale(1);
                opacity: 1;
            }
        }

        #stationary-content.rolling-animation {
            animation: pulse-fast 0.3s infinite alternate ease-in-out;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        label {
            font-size: 1.2rem;
        }

        #sides-selector {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #fff;
            background-color: #34495e;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        #result-display {
            margin-top: 20px;
            font-size: 2rem;
            height: 40px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="scene">
        <div class="item-box" id="item-box">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
        <div id="stationary-content">?</div>
    </div>

    <div class="controls">
        <label for="sides-selector">Escolha o número de lados:</label>
        <select id="sides-selector">
            <option value="6">6 Lados (D6)</option>
            <option value="10">10 Lados (D10)</option>
            <option value="12">12 Lados (D12)</option>
            <option value="20">20 Lados (D20)</option>
            <option value="100">100 Lados (D100)</option>
        </select>
    </div>

    <h2 id="result-display"></h2>

    <script>
        const itemBox = document.getElementById('item-box');
        const diceContent = document.getElementById('stationary-content');
        const sidesSelector = document.getElementById('sides-selector');
        const resultDisplay = document.getElementById('result-display');
        let rollingInterval;

        const rollSound = new Audio('https://github.com/lucashirotsu/Dado/blob/main/Som.mp3?raw=true');

        function getRandomNumber(max) {
            return Math.floor(Math.random() * max) + 1;
        }

        itemBox.addEventListener('click', () => {
            if (itemBox.classList.contains('rolling')) {
                return;
            }

            rollSound.currentTime = 0;
            rollSound.play();

            itemBox.classList.add('rolling');
            diceContent.classList.add('rolling-animation');
            resultDisplay.textContent = 'Sorteando...';

            const maxSides = parseInt(sidesSelector.value);

            rollingInterval = setInterval(() => {
                const randomValue = getRandomNumber(maxSides);
                diceContent.textContent = randomValue;
            }, 70);

            setTimeout(() => {
                clearInterval(rollingInterval);
                const finalResult = getRandomNumber(maxSides);
                diceContent.textContent = finalResult;
                resultDisplay.textContent = `Resultado: ${finalResult}`;
                itemBox.classList.remove('rolling');
                diceContent.classList.remove('rolling-animation');
            }, 3500);
        });
    </script>
</body>

</html>
